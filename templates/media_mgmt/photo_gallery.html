<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Photo Gallery &mdash; {{ person }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-4">
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Photos for {{ person }} ({{ person.individual_id }})</h2>
        <a href="{% url 'media_mgmt:photo_upload' %}?individual_id={{ person.individual_id }}" class="btn btn-primary">Add Photo</a>
    </div>

    <div class="row g-4">
        {% for photo in photos %}
            <div class="col-sm-6 col-md-4 col-lg-3">
                <div class="card h-100 shadow-sm">
                    <img src="{{ photo.image_file.url }}" class="card-img-top" style="height: 180px; object-fit: cover;" alt="{{ photo.caption }}">
                    <div class="card-body">
                        <h6 class="card-title text-truncate">{{ photo.caption|default:photo.photo_id }}</h6>
                        <p class="card-text small text-muted text-truncate">{{ photo.description|default:"No description" }}</p>
                        <a href="{% url 'media_mgmt:photo_detail' photo.photo_id %}" class="btn btn-outline-primary btn-sm w-100">View Details</a>
                    </div>
                </div>
            </div>
        {% empty %}
            <div class="col-12">
                <div class="alert alert-secondary">No active photos stored for this family member.</div>
            </div>
        {% endfor %}
    </div>
</div>
</body>
</html>
