<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Invitation Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
<div class="container text-center" style="max-width: 500px;">
    <div class="card shadow-sm border-danger">
        <div class="card-header bg-danger text-white">
            <h5 class="mb-0">Invalid or Expired Invitation</h5>
        </div>
        <div class="card-body py-4">
            <p class="text-danger mb-3">{{ error_message }}</p>
            <p class="text-muted small">Please contact the family member who invited you to request a fresh invitation link.</p>
        </div>
    </div>
</div>
</body>
</html>
